<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hunt desk — In Search Of</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Hanken+Grotesk:wght@200;300;400;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background: var(--paper); }
    .desk { max-width: 1280px; margin: 0 auto; padding: 24px 20px 80px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .top h1 { font-size: 32px; }
    .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; }
    .kpi b { font: 600 30px/1 var(--serif); display: block; margin-bottom: 4px; }
    .kpi span { font-size: 13px; color: var(--ink-3); }
    .kpi.hot { border-color: var(--signal); background: var(--signal-soft); }
    .kpi.hot b { color: var(--signal-ink); }
    @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .filters button { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
    .filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .list { display: grid; gap: 8px; }
    .row-h { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-decoration: none; }
    .row-h:hover { border-color: var(--ink); }
    .row-h .thumb { width: 64px; height: 64px; border-radius: 8px; background: var(--paper-2); object-fit: cover; display: grid; place-items: center; font-size: 26px; }
    .row-h .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .row-h .meta { font-size: 13px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .row-h .right { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .detail { grid-template-columns: 1fr; } .row-h { grid-template-columns: 48px 1fr; } .row-h .thumb { width: 48px; height: 48px; } .row-h .right { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; } }
    .card h3 { font-size: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .stack { display: grid; gap: 16px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
    .links a { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-decoration: none; background: #fff; font-size: 14px; font-weight: 600; }
    .links a:hover { border-color: var(--ink); }
    .links a.visited { opacity: 0.55; }
    .links a::after { content: ' ↗'; color: var(--ink-3); }
    .m { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; background: #fff; }
    .m.approved { border-color: var(--green); background: var(--green-soft); }
    .m.rejected, .m.gone { opacity: 0.55; }
    .draft { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; background: #fff; }
    .draft pre { white-space: pre-wrap; font: 14px/1.45 var(--sans); margin: 6px 0 10px; color: var(--ink-2); max-height: 140px; overflow: auto; }
    .log { font-size: 13px; color: var(--ink-2); max-height: 240px; overflow: auto; }
    .log div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
    .brief img { border-radius: 10px; max-height: 280px; object-fit: contain; width: 100%; background: var(--paper-2); margin-bottom: 12px; }
    dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0 0; font-size: 14px; }
    dl.kv dt { color: var(--ink-3); }
    dl.kv dd { margin: 0; overflow-wrap: anywhere; }
    .inline { display: flex; gap: 8px; }
    .inline .input { flex: 1; }
    .login { max-width: 380px; margin: 12vh auto; }
    .hl { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="desk" id="app"><div class="skeleton">Loading…</div></div>
  <script src="/admin.js"></script>
</body>
</html>
