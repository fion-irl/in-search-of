<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your hunt — In Search Of</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .hunt-head { padding: 48px 0 24px; }
    .hunt-head h1 { font-size: clamp(34px, 6vw, 56px); margin: 14px 0 8px; }
    .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; padding-bottom: 60px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 20px; position: relative; }
    .timeline li:not(:last-child)::after { content: ''; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
    .timeline .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 13px; z-index: 1; }
    .timeline li.done .dot { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .timeline li.now .dot { border-color: var(--signal); background: var(--signal-soft); color: var(--signal-ink); }
    .timeline li b { display: block; }
    .timeline li span { color: var(--ink-3); font-size: 14px; }
    .progress { height: 10px; border-radius: 999px; background: var(--paper-2); overflow: hidden; margin: 12px 0 6px; }
    .progress > div { height: 100%; background: var(--signal); border-radius: 999px; }
    .match { border: 1.5px solid var(--green); background: var(--green-soft); border-radius: 12px; padding: 16px; margin-top: 12px; }
    .match a.title { font: 600 20px var(--serif); text-decoration: none; }
    .brief img { border-radius: 10px; margin-bottom: 12px; max-height: 260px; object-fit: contain; background: var(--paper-2); width: 100%; }
    .brief dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0 0; font-size: 15px; }
    .brief dt { color: var(--ink-3); }
    .brief dd { margin: 0; overflow-wrap: anywhere; }
    .share { background: var(--ink); color: var(--paper); }
    .share h3 { font-size: 24px; margin-bottom: 8px; }
    .share p { color: #d6ccbb; margin: 0 0 14px; font-size: 15px; }
    .share .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .share .btn.ghost { color: var(--paper); border-color: var(--paper); }
  </style>
</head>
<body>
  <nav class="nav"><div class="wrap"><a class="logo" href="/"><span class="logo-mark">ISO</span> In Search Of</a><a class="btn sm ghost" href="/#start">New hunt</a></div></nav>
  <main class="wrap" id="app"><div class="skeleton">Loading your hunt…</div></main>

  <script>
  (() => {
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const token = location.pathname.split('/').pop();
    const fmt = (d) => new Date(d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const fmtT = (d) => new Date(d).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    try { localStorage.setItem('iso_last_hunt', token); } catch {}
    let timer;

    async function load() {
      const r = await fetch('/api/hunts/' + encodeURIComponent(token));
      if (!r.ok) { $('#app').innerHTML = '<div class="skeleton"><h2>Hunt not found</h2><p>Check the link we sent you on WhatsApp.</p></div>'; return; }
      render(await r.json());
    }

    function headline(h) {
      switch (h.status) {
        case 'awaiting_payment': return ['One step left', 'Lock in your hunt and we start the feasibility check right away.'];
        case 'reviewing': return ['Checking it\'s findable', `We'll confirm by ${fmtT(h.feasibilityDueAt)}. If we can't find it, full refund — the clock hasn't started.`];
        case 'hunting': return ['We\'re on the hunt 🔎', `Day ${h.dayNumber} of ${h.tierDays}. We sweep every day and WhatsApp you the moment something fits.`];
        case 'found': return ['We found it! 🎯', 'Message the seller soon — good listings move fast. If it falls through, reply on WhatsApp and we keep hunting.'];
        case 'closed': return ['Hunt complete 🙌', 'You got it. Enjoy — and thanks for hunting with us.'];
        case 'declined': return ['We couldn\'t take this one', (h.declineReason ? h.declineReason + '. ' : '') + (h.refundedAt ? 'Your full refund has been issued.' : 'Your full refund is on its way.')];
        case 'expired': return ['Hunt window ended', 'We didn\'t find a match within your budget, so — as promised — ' + (h.refundedAt ? 'you\'ve been refunded in full.' : 'your full refund is on its way.')];
        default: return ['Hunt cancelled', h.refundedAt ? 'You\'ve been refunded.' : ''];
      }
    }

    function render(h) {
      const [title, sub] = headline(h);
      // Number of timeline steps completed for each status; the next step is "now".
      const doneCount = { awaiting_payment: 1, reviewing: 2, hunting: 3, found: 5, closed: 5 }[h.status];
      const stepState = (i) => {
        if (doneCount == null) return i === 0 || (i === 1 && h.paidAt) || (i === 2 && h.huntStartedAt) ? 'done' : '';
        return i < doneCount ? 'done' : i === doneCount ? 'now' : '';
      };
      const steps = [
        ['Hunt submitted', fmt(h.createdAt)],
        ['Paid · $' + h.price, h.paidAt ? fmt(h.paidAt) : 'Waiting for payment'],
        ['Feasibility check', h.huntStartedAt ? 'Passed ✓' : h.status === 'declined' ? 'Not findable — refunded' : 'Within 24h of payment'],
        [`Hunting · ${h.tierDays} days`, h.huntStartedAt ? `${fmt(h.huntStartedAt)} → ${fmt(h.huntEndsAt)}` : 'Starts after the check'],
        ['Found it!', h.matches.length ? fmt(h.matches[0].createdAt) : 'We\'ll WhatsApp you'],
      ];
      const pct = h.tierDays && h.dayNumber ? Math.min(100, Math.round((h.dayNumber / h.tierDays) * 100)) : 0;

      $('#app').innerHTML = `
        <div class="hunt-head">
          <span class="pill ${h.status === 'found' || h.status === 'closed' ? 'green' : h.status === 'hunting' ? 'signal' : ''}">${esc(h.id)} · ${esc(h.statusLabel)}</span>
          <h1>${esc(title)}</h1>
          <p class="muted" style="font-size:18px;max-width:52ch;margin:0">${esc(sub)}</p>
          ${h.payUrl ? `<p style="margin-top:22px"><a class="btn signal" href="${esc(h.payUrl)}">Pay $${h.price} & start my hunt →</a></p>` : ''}
          ${h.status === 'awaiting_payment' && !h.payUrl ? `<p class="card" style="margin-top:22px">Thanks, ${esc(h.name)}! We'll WhatsApp you a secure payment link shortly to kick off your hunt.</p>` : ''}
        </div>
        <div class="grid">
          <div>
            ${h.matches.length ? `<div class="card" style="margin-bottom:20px"><h3 style="font-size:24px">Your finds</h3>${h.matches.map((m) => `
              <div class="match">
                <a class="title" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)} ↗</a>
                <div style="margin-top:4px"><b>$${m.price}</b> · ${esc(m.source)} · <span class="muted">${fmt(m.createdAt)}</span></div>
                ${m.note ? `<p style="margin:8px 0 0">${esc(m.note)}</p>` : ''}
              </div>`).join('')}</div>` : ''}
            <div class="card">
              <h3 style="font-size:24px;margin-bottom:18px">Progress</h3>
              <ol class="timeline">${steps.map((s, i) => `<li class="${stepState(i)}"><div class="dot">${stepState(i) === 'done' ? '✓' : i + 1}</div><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div></li>`).join('')}</ol>
              ${h.status === 'hunting' ? `<div class="progress"><div style="width:${pct}%"></div></div><div class="muted" style="font-size:14px">${h.daysLeft} day${h.daysLeft === 1 ? '' : 's'} left · ${h.sweeps} sweep${h.sweeps === 1 ? '' : 's'} so far${h.lastSweptAt ? ` · last ${fmtT(h.lastSweptAt)}` : ''}</div>` : ''}
            </div>
          </div>
          <div>
            <div class="card brief">
              <h3 style="font-size:20px;margin-bottom:12px">Your brief</h3>
              ${h.imageUrl ? `<img src="${esc(h.imageUrl)}" alt="Your reference photo" />` : ''}
              ${h.description ? `<p style="margin:0;white-space:pre-wrap">${esc(h.description)}</p>` : ''}
              <dl>
                ${h.link ? `<dt>Link</dt><dd><a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.link.replace(/^https?:\/\//, '').slice(0, 48))}…</a></dd>` : ''}
                <dt>Max price</dt><dd><b>$${h.maxPrice}</b> — never over</dd>
                <dt>Hunt</dt><dd>${h.tierDays} days · $${h.price}</dd>
                <dt>Guarantee</dt><dd>Find it or it's free</dd>
              </dl>
            </div>
            <div class="card share" style="margin-top:20px">
              <h3>Know someone hunting?</h3>
              <p>Every Buy Nothing group has five ISO posts a day. Send them our way.</p>
              <div class="btns">
                <button class="btn signal sm" id="shareBtn">Share</button>
                <a class="btn ghost sm" href="https://wa.me/?text=${encodeURIComponent('Found this — they hunt down secondhand stuff for you and it\'s free if they don\'t find it: ' + h.shareUrl)}" target="_blank" rel="noopener">WhatsApp</a>
                <button class="btn ghost sm" id="copyBtn">Copy link</button>
              </div>
            </div>
          </div>
        </div>`;

      const shareText = 'They hunt down secondhand stuff for you — and it\'s free if they don\'t find it.';
      $('#shareBtn').onclick = async () => {
        if (navigator.share) { try { await navigator.share({ title: 'In Search Of', text: shareText, url: h.shareUrl }); } catch {} }
        else $('#copyBtn').click();
      };
      $('#copyBtn').onclick = async () => {
        try { await navigator.clipboard.writeText(h.shareUrl); $('#copyBtn').textContent = 'Copied ✓'; } catch { prompt('Copy this link:', h.shareUrl); }
      };

      clearTimeout(timer);
      if (h.status === 'awaiting_payment' || h.status === 'reviewing') timer = setTimeout(load, 15000);
    }
    load();
  })();
  </script>
</body>
</html>
